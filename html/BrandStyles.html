<style id="reos-brand-styles">
  :root {
    --reos-primary: #0f3557;
    --reos-secondary: #5f6b73;
    --reos-accent: #f47c20;
    --reos-text: #2b2b2b;
    --reos-background: #ffffff;
    --reos-heading-font: "Montserrat", Arial, sans-serif;
    --reos-body-font: "Source Sans Pro", Arial, sans-serif;
  }

  html,
  body {
    background: var(--reos-background);
    color: var(--reos-text);
    font-family: var(--reos-body-font);
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    color: var(--reos-primary);
    font-family: var(--reos-heading-font);
  }

  .reos-primary {
    color: var(--reos-primary);
  }

  .reos-accent {
    color: var(--reos-accent);
  }

  .reos-button-primary {
    background: var(--reos-primary);
    border: 1px solid var(--reos-primary);
    color: #ffffff;
  }

  .reos-button-accent {
    background: var(--reos-accent);
    border: 1px solid var(--reos-accent);
    color: #ffffff;
  }
</style>

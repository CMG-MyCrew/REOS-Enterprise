name: Absentee owner V3 PR319 local synthetic merge validation v1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-synthetic-merge-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout dispatch main snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: dispatch-main
          persist-credentials: false
          fetch-depth: 0

      - name: Certify dispatch main and V3 workflow promotion scope
        shell: bash
        env:
          PRE_V3_MAIN: 5270fbf525b23dafedd429e275be5bcd77b965c3
          SUPPORT_WORKFLOW: .github/workflows/absentee-owner-v2-pr319-exact-merge-validation-v1.yml
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/dispatch-main"

          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REPOSITORY" = "CMG-MyCrew/REOS-Enterprise"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          test "$GITHUB_SHA" != "$PRE_V3_MAIN"

          git cat-file -e "$PRE_V3_MAIN^{commit}"
          git merge-base --is-ancestor \
            "$PRE_V3_MAIN" \
            "$GITHUB_SHA"

          mapfile -t main_changes < <(
            git diff-tree \
              --no-commit-id \
              --name-status \
              -r \
              "$PRE_V3_MAIN" \
              "$GITHUB_SHA"
          )

          test "${#main_changes[@]}" -eq 1
          test "${main_changes[0]}" = \
            $'M\t'"$SUPPORT_WORKFLOW"

          git cat-file -e \
            "$GITHUB_SHA:$SUPPORT_WORKFLOW"

          test -z "$(
            git status \
              --porcelain=v1 \
              --untracked-files=all
          )"

          printf 'DISPATCH_MAIN_SHA=%s\n' "$GITHUB_SHA"
          printf 'POST_V3_PROMOTION_MAIN_SCOPE_EXACT=true\n'

      - name: Checkout frozen PR319 runtime source branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/absentee-owner-v2-exact-event-read-only-reconciliation-v1
          path: runtime-source
          persist-credentials: false
          fetch-depth: 0

      - name: Certify and import frozen runtime source
        shell: bash
        env:
          DISPATCH_MAIN: ${{ github.sha }}
          RUNTIME_HEAD: d26c205c1f47ae28b60c176c209e0fc5a409e92a
          TRUE_MERGE_BASE: 5a91795628b4c837b83e32e7b4b09ecabe12b89d
          RUNTIME_FILE: build/apps-script-brand/AbsenteeOwnerClassificationEvidenceStoreV2ExactEventReadOnlyReconciliation.js
          RUNTIME_SHA256: 0f274486d26b09833a19ddf5104b69c00379e54506e1d14e415fe839303da7d2
        run: |
          set -euo pipefail

          runtime_repo="$GITHUB_WORKSPACE/runtime-source"
          merge_repo="$GITHUB_WORKSPACE/dispatch-main"

          runtime_checkout="$(
            git -C "$runtime_repo" rev-parse HEAD
          )"

          test "$runtime_checkout" = "$RUNTIME_HEAD"

          test -z "$(
            git -C "$runtime_repo" status \
              --porcelain=v1 \
              --untracked-files=all
          )"

          git -C "$merge_repo" fetch \
            --quiet \
            --no-tags \
            "$runtime_repo" \
            HEAD

          imported_runtime="$(
            git -C "$merge_repo" rev-parse FETCH_HEAD
          )"

          test "$imported_runtime" = "$RUNTIME_HEAD"

          git -C "$merge_repo" cat-file -e \
            "$RUNTIME_HEAD^{commit}"

          merge_base="$(
            git -C "$merge_repo" merge-base \
              "$DISPATCH_MAIN" \
              "$RUNTIME_HEAD"
          )"

          runtime_parent="$(
            git -C "$merge_repo" rev-parse \
              "$RUNTIME_HEAD^"
          )"

          runtime_ahead="$(
            git -C "$merge_repo" rev-list \
              --count \
              "$TRUE_MERGE_BASE..$RUNTIME_HEAD"
          )"

          test "$merge_base" = "$TRUE_MERGE_BASE"
          test "$runtime_parent" = "$TRUE_MERGE_BASE"
          test "$runtime_ahead" = "1"

          mapfile -t runtime_changes < <(
            git -C "$merge_repo" diff \
              --name-status \
              "$TRUE_MERGE_BASE" \
              "$RUNTIME_HEAD"
          )

          test "${#runtime_changes[@]}" -eq 1
          test "${runtime_changes[0]}" = \
            $'A\t'"$RUNTIME_FILE"

          runtime_sha="$(
            git -C "$merge_repo" cat-file blob \
              "$RUNTIME_HEAD:$RUNTIME_FILE" |
              sha256sum |
              awk '{print $1}'
          )"

          test "$runtime_sha" = "$RUNTIME_SHA256"

          test -z "$(
            git -C "$merge_repo" status \
              --porcelain=v1 \
              --untracked-files=all
          )"

          printf 'FROZEN_RUNTIME_HEAD_EXACT=true\n'
          printf 'TRUE_MERGE_BASE_EXACT=true\n'
          printf 'RUNTIME_HEAD_PARENT_EXACT=true\n'
          printf 'RUNTIME_BRANCH_SCOPE_EXACT=true\n'
          printf 'RUNTIME_BRANCH_SHA256_EXACT=true\n'

      - name: Create ephemeral local synthetic merge
        id: synthetic_merge
        shell: bash
        env:
          DISPATCH_MAIN: ${{ github.sha }}
          RUNTIME_HEAD: d26c205c1f47ae28b60c176c209e0fc5a409e92a
          RUNTIME_FILE: build/apps-script-brand/AbsenteeOwnerClassificationEvidenceStoreV2ExactEventReadOnlyReconciliation.js
          RUNTIME_SHA256: 0f274486d26b09833a19ddf5104b69c00379e54506e1d14e415fe839303da7d2
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/dispatch-main"

          test "$(git rev-parse HEAD)" = "$DISPATCH_MAIN"

          test -z "$(
            git status \
              --porcelain=v1 \
              --untracked-files=all
          )"

          GIT_MERGE_AUTOEDIT=no \
          git merge \
            --no-commit \
            --no-ff \
            "$RUNTIME_HEAD"

          test "$(git rev-parse HEAD)" = "$DISPATCH_MAIN"

          merge_head="$(
            git rev-parse MERGE_HEAD
          )"

          test "$merge_head" = "$RUNTIME_HEAD"

          unmerged_count="$(
            git ls-files -u |
              wc -l |
              tr -d ' '
          )"

          test "$unmerged_count" = "0"

          synthetic_tree="$(
            git write-tree
          )"

          mapfile -t synthetic_changes < <(
            git diff \
              --cached \
              --name-status \
              "$DISPATCH_MAIN"
          )

          test "${#synthetic_changes[@]}" -eq 1
          test "${synthetic_changes[0]}" = \
            $'A\t'"$RUNTIME_FILE"

          git diff \
            --cached \
            --check \
            "$DISPATCH_MAIN"

          runtime_sha="$(
            sha256sum "$RUNTIME_FILE" |
              awk '{print $1}'
          )"

          test "$runtime_sha" = "$RUNTIME_SHA256"

          printf 'synthetic_tree=%s\n' \
            "$synthetic_tree" >> "$GITHUB_OUTPUT"

          printf 'LOCAL_SYNTHETIC_MERGE_CLEAN=true\n'
          printf 'LOCAL_SYNTHETIC_MERGE_HEAD=%s\n' \
            "$merge_head"
          printf 'LOCAL_SYNTHETIC_MERGE_TREE=%s\n' \
            "$synthetic_tree"
          printf 'LOCAL_SYNTHETIC_FIRST_PARENT_SCOPE_EXACT=true\n'
          printf 'LOCAL_SYNTHETIC_RUNTIME_SHA256_EXACT=true\n'

      - name: Validate reconciliation runtime syntax
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/dispatch-main"

          node --check \
            build/apps-script-brand/AbsenteeOwnerClassificationEvidenceStoreV2ExactEventReadOnlyReconciliation.js

          printf 'RECONCILIATION_RUNTIME_NODE_SYNTAX_VALID=true\n'

      - name: Validate reconciliation read-only safety boundary
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/dispatch-main"

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "build/apps-script-brand/"
              "AbsenteeOwnerClassificationEvidenceStoreV2ExactEventReadOnlyReconciliation.js"
          )

          text = path.read_text(encoding="utf-8")

          required_exact_once = [
              "function reosAbsenteeOwnerClassificationEvidenceStoreV2ExactEventReadOnlyReconciliation",
              "READ_ONLY_EXACT_V2_EVENT_RECONCILIATION",
              "ABSENTEE_OWNER_V2_EXACT_EVENT_RECONCILIATION_VERIFIED",
              "ABSENTEE_OWNER_V2_EXACT_EVENT_RECONCILIATION_NOT_PRESENT",
              "ABSENTEE_OWNER_V2_EXACT_EVENT_RECONCILIATION_PRECONDITION_FAILED",
          ]

          for marker in required_exact_once:
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(
                      f"required marker count mismatch: {marker}: {count}"
                  )

          required_safety_markers = [
              "No persistence authority.",
              "No retry authority.",
              "No DISTRESS_LEADS access.",
              "No external HTTP.",
              "No scheduler, trigger, ARV, repair-scope, MAO, or offer authority.",
          ]

          for marker in required_safety_markers:
              if marker not in text:
                  raise SystemExit(
                      f"required safety marker absent: {marker}"
                  )

          forbidden = [
              "UrlFetchApp",
              ".setValue(",
              ".setValues(",
              ".appendRow(",
              ".insertRow(",
              ".deleteRow(",
              ".insertSheet(",
              ".deleteSheet(",
              ".clear(",
              ".clearContent(",
              ".setFormula(",
              ".setFormulaR1C1(",
              ".persist(",
              "AcquisitionWorkflow",
              "DealLifecycleWorkflow",
              "Suggested Offer",
              "Estimated Repairs",
              "Estimated Value",
          ]

          for marker in forbidden:
              if marker in text:
                  raise SystemExit(
                      f"forbidden authority/mutation marker present: {marker}"
                  )

          print("READ_ONLY_REQUIRED_MARKERS_EXACT=true")
          print("WRITE_API_MARKERS_ABSENT=true")
          print("EXTERNAL_HTTP_MARKER_ABSENT=true")
          print("PERSISTENCE_CALL_MARKER_ABSENT=true")
          print("ACQUISITION_AUTHORITY_MARKERS_ABSENT=true")
          PY

      - name: Validate current county runtime integration
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/dispatch-main"

          node scripts/validate-county-runtime-integration.js

          printf 'COUNTY_RUNTIME_INTEGRATION_VALID=true\n'

      - name: Validate planner successor immutability
        shell: bash
        env:
          DISPATCH_MAIN: ${{ github.sha }}
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/dispatch-main"

          git diff \
            --cached \
            --quiet \
            "$DISPATCH_MAIN" \
            -- \
            build/apps-script-brand/AbsenteeOwnerClassificationPersistenceCertifiedPropertySourceProvenancePlannerV2.js \
            scripts/validate-absentee-owner-classification-persistence-certified-property-source-provenance-planner-v2.js \
            scripts/validate-absentee-owner-classification-persistence-certified-property-source-provenance-planner-behavior-v2.js \
            scripts/validate-absentee-owner-classification-persistence-certified-property-source-provenance-planner-integration-v2.js

          printf 'PLANNER_SUCCESSOR_IMMUTABILITY_VALID=true\n'

      - name: Validate evidence-store successor immutability
        shell: bash
        env:
          DISPATCH_MAIN: ${{ github.sha }}
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/dispatch-main"

          git diff \
            --cached \
            --quiet \
            "$DISPATCH_MAIN" \
            -- \
            build/apps-script-brand/AbsenteeOwnerClassificationEvidenceStoreV2.js \
            scripts/validate-absentee-owner-classification-evidence-store-v2.js \
            scripts/validate-absentee-owner-classification-evidence-store-behavior-v2.js \
            scripts/validate-absentee-owner-classification-evidence-store-integration-v2.js

          printf 'EVIDENCE_STORE_SUCCESSOR_IMMUTABILITY_VALID=true\n'

      - name: Certify acquisition authority remains absent
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/dispatch-main"

          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "build/apps-script-brand/"
              "AbsenteeOwnerClassificationEvidenceStoreV2ExactEventReadOnlyReconciliation.js"
          )

          text = path.read_text(encoding="utf-8")

          required = (
              "No scheduler, trigger, ARV, repair-scope, MAO, or offer authority."
          )

          if required not in text:
              raise SystemExit(
                  "acquisition authority denial marker absent"
              )

          forbidden = [
              "AcquisitionWorkflow",
              "DealLifecycleWorkflow",
              "Suggested Offer",
              "Estimated Repairs",
              "Estimated Value",
              "reosCalculateMao",
              "reosGenerateOffer",
              "reosSubmitOffer",
          ]

          for marker in forbidden:
              if marker in text:
                  raise SystemExit(
                      f"downstream acquisition marker present: {marker}"
                  )

          print("ARV_AUTHORITY_GRANTED=false")
          print("REPAIR_SCOPE_AUTHORITY_GRANTED=false")
          print("MAO_AUTHORITY_GRANTED=false")
          print("OFFER_GENERATION_AUTHORITY_GRANTED=false")
          print("OFFER_SUBMISSION_AUTHORITY_GRANTED=false")
          PY

      - name: Abort ephemeral local synthetic merge
        if: always()
        shell: bash
        env:
          DISPATCH_MAIN: ${{ github.sha }}
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/dispatch-main"

          if git rev-parse \
               --verify \
               --quiet \
               MERGE_HEAD >/dev/null; then
            git merge --abort
          fi

          test "$(git rev-parse HEAD)" = "$DISPATCH_MAIN"

          test -z "$(
            git status \
              --porcelain=v1 \
              --untracked-files=all
          )"

          printf 'EPHEMERAL_SYNTHETIC_MERGE_ABORTED=true\n'
          printf 'DISPATCH_MAIN_WORKTREE_RESTORED=true\n'

      - name: Checkout final main race snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: final-main
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout final runtime-head race snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/absentee-owner-v2-exact-event-read-only-reconciliation-v1
          path: final-runtime
          persist-credentials: false
          fetch-depth: 0

      - name: Final main and runtime-head race certification
        shell: bash
        env:
          DISPATCH_MAIN: ${{ github.sha }}
          RUNTIME_HEAD: d26c205c1f47ae28b60c176c209e0fc5a409e92a
          SYNTHETIC_TREE: ${{ steps.synthetic_merge.outputs.synthetic_tree }}
        run: |
          set -euo pipefail

          final_main="$(
            git -C "$GITHUB_WORKSPACE/final-main" \
              rev-parse HEAD
          )"

          final_runtime="$(
            git -C "$GITHUB_WORKSPACE/final-runtime" \
              rev-parse HEAD
          )"

          test "$final_main" = "$DISPATCH_MAIN"
          test "$final_runtime" = "$RUNTIME_HEAD"
          test -n "$SYNTHETIC_TREE"

          printf 'FINAL_MAIN_RACE_ABSENT=true\n'
          printf 'FINAL_RUNTIME_HEAD_RACE_ABSENT=true\n'
          printf 'LOCAL_SYNTHETIC_MERGE_VALIDATION=true\n'
          printf 'GITHUB_PULL_MERGE_REF_DEPENDENCY=false\n'
          printf 'PR319_SOURCE_MUTATION_EXECUTED=false\n'

name: County collapse offline validation

on:
  pull_request:
  push:
    branches:
      - main
      - ci/county-collapse-offline-validation-v1

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Report Node runtime
        run: node --version

      - name: Check JavaScript syntax
        run: |
          node --check build/apps-script-brand/CountyCodeViolationCollapseExecutionPreflight.js
          node --check scripts/validate-county-code-violation-collapse-winner-plan-v1.js
          node --check scripts/validate-county-code-violation-collapse-execution-preflight-v1.js
          node --check scripts/validate-county-code-violation-collapse-executor-contract-v1.js
          node --check scripts/validate-county-code-violation-collapse-maintenance-quiescence-contract-v1.js
          node --check scripts/validate-county-collapse-operation-intent-contract-v1.js
          node --check scripts/validate-county-collapse-observation-preservation-contract-v1.js
          node --check scripts/validate-county-collapse-observation-preservation-implementation-contract-v1.js
          node --check scripts/validate-county-collapse-operation-intent-store-v1.js
          node --check build/apps-script-brand/Database.js
          node --check scripts/validate-database-physical-row-patch-exact.js
          node --check build/apps-script-brand/CountyCollapseObservationPreservationStore.js
          node --check scripts/validate-county-collapse-observation-preservation-store-v1.js
          node --check scripts/validate-county-runtime-integration.js

      - name: Validate winner plan with local fixtures
        run: node scripts/validate-county-code-violation-collapse-winner-plan-v1.js

      - name: Validate execution preflight with mocked services
        run: node scripts/validate-county-code-violation-collapse-execution-preflight-v1.js

      - name: Validate collapse executor contract
        run: node scripts/validate-county-code-violation-collapse-executor-contract-v1.js

      - name: Validate collapse maintenance / writer-quiescence contract
        run: node scripts/validate-county-code-violation-collapse-maintenance-quiescence-contract-v1.js

      - name: Validate collapse operation-intent contract
        run: node scripts/validate-county-collapse-operation-intent-contract-v1.js

      - name: Validate collapse observation-preservation contract
        run: node scripts/validate-county-collapse-observation-preservation-contract-v1.js

      - name: Validate collapse observation-preservation implementation contracts
        run: node scripts/validate-county-collapse-observation-preservation-implementation-contract-v1.js

      - name: Validate collapse operation-intent store
        run: node scripts/validate-county-collapse-operation-intent-store-v1.js

      - name: Validate database lock-context revocation
        run: node scripts/validate-database-lock-context-revocation.js

      - name: Validate database lock handoff
        run: node scripts/validate-database-lock-handoff.js

      - name: Validate database physical-row delete exact
        run: node scripts/validate-database-physical-row-delete-exact.js

      - name: Validate database physical-row patch exact
        run: node scripts/validate-database-physical-row-patch-exact.js

      - name: Validate collapse observation-preservation store
        run: node scripts/validate-county-collapse-observation-preservation-store-v1.js

      - name: Validate county runtime integration
        run: node scripts/validate-county-runtime-integration.js
